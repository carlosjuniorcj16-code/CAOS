name: CAOS trusted automation auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: caos-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: Enable auto-merge for trusted data updates
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      contains(fromJSON('["automation/wikidata-discovery","automation/multi-source-academic-discovery","automation/research-radar","automation/curlie-catalog-update"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub auto-merge after required protections pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
