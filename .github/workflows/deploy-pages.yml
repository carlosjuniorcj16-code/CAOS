name: Build and deploy CAOS SEO site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: caos-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static SEO pages
        env:
          CAOS_SITE_URL: https://carlosjuniorcj16-code.github.io/CAOS
        run: |
          python -m py_compile scripts/build_seo.py scripts/build_search_index.py
          python scripts/build_search_index.py
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("data/sources.json").read_text(encoding="utf-8"))
          resources = source if isinstance(source, list) else source.get("resources", [])
          index = json.loads(Path("search-index.json").read_text(encoding="utf-8"))
          assert resources and index.get("total") == len(resources) == len(index.get("resources", [])), "Search index does not cover the complete catalogue"
          print(f"Search index verified: {index['total']:,} records")
          PY
          python scripts/build_seo.py
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/search-index.json
          test -s dist/categorias/index.html
          for path in radar.html leituras.html software.html freeware.html data/research-radar.json data/reading-recommendations.json data/open-source-software.json data/freeware.json assets/caos-mark.svg; do test -s "dist/$path"; done
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("dist")
          ET.parse(root / "sitemap.xml")
          sitemap = ET.parse(root / "sitemap-1.xml")
          ET.parse(root / "assets/caos-mark.svg")
          locations = {node.text for node in sitemap.findall(".//{*}loc")}
          for page in ("radar.html", "leituras.html", "software.html", "freeware.html"):
              expected = "https://carlosjuniorcj16-code.github.io/CAOS/" + page
              if expected not in locations:
                  raise SystemExit(f"Missing standalone page in sitemap: {page}")
          pages = list(root.rglob("index.html"))
          if len(pages) < 2:
              raise SystemExit("SEO build produced too few HTML pages")
          print(f"SEO build OK: {len(pages)} HTML pages")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
