name: Build and deploy CAOS SEO site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: caos-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static SEO pages
        env:
          CAOS_SITE_URL: https://carlosjuniorcj16-code.github.io/CAOS
        run: |
          python -m py_compile scripts/build_seo.py scripts/build_search_index.py
          python scripts/build_search_index.py
          python scripts/build_seo.py
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/categorias/index.html
          for path in radar.html leituras.html software.html data/research-radar.json data/reading-recommendations.json data/open-source-software.json assets/caos-mark.svg; do test -s "dist/$path"; done
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("dist")
          ET.parse(root / "sitemap.xml")
          ET.parse(root / "sitemap-1.xml")
          ET.parse(root / "assets/caos-mark.svg")
          pages = list(root.rglob("index.html"))
          if len(pages) < 2:
              raise SystemExit("SEO build produced too few HTML pages")
          print(f"SEO build OK: {len(pages)} HTML pages")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
