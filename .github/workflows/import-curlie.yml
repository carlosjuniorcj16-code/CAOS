name: Import Curlie directory data

on:
  push:
    branches: [main, automation/curlie-catalog-update]
    paths:
      - 'scripts/import_curlie.py'
      - '.github/workflows/import-curlie.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 4 1 * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: caos-catalog-ingestion
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download official Curlie dataset
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://share.innkube.fim.uni-passau.de/curlie-rdf/curlie-rdf-all.tar.gz" \
            --output /tmp/curlie-rdf-all.tar.gz
      - name: Import curated resources
        run: |
          python scripts/import_curlie.py \
            --dump /tmp/curlie-rdf-all.tar.gz \
            --catalog data/sources.json \
            --limit 50000 \
            --per-topic 1000
      - name: Commit repaired catalog to the existing PR branch
        if: github.ref == 'refs/heads/automation/curlie-catalog-update'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/sources/*.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: reassign Curlie IDs after Wikidata range"
            git push origin HEAD:automation/curlie-catalog-update
          fi

      - name: Create catalog update pull request
        if: github.ref != 'refs/heads/automation/curlie-catalog-update'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/curlie-catalog-update
          delete-branch: true
          commit-message: "chore: refresh curated Curlie resources"
          title: "chore: refresh Curlie resource catalog"
          body: |
            Automated refresh of curated resources imported from the official Curlie dataset.
            This trusted data-update PR is eligible for automatic squash merge after the required catalog validation and Pages build succeed. Branch protections remain enforced.
          add-paths: |
            data/sources.json
            data/sources/*.json

      - name: Dispatch validation and build for the bot PR
        if: github.ref == 'refs/heads/automation/curlie-catalog-update' || steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/curlie-catalog-update
        run: |
          gh workflow run "Validate project" --ref "$BRANCH"
          gh workflow run "Build and deploy CAOS SEO site" --ref "$BRANCH"
