name: Import Curlie directory data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_curlie.py'
      - '.github/workflows/import-curlie.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 4 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: caos-catalog-ingestion
  cancel-in-progress: false

concurrency:
  group: curlie-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download official Curlie dataset
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://share.innkube.fim.uni-passau.de/curlie-rdf/curlie-rdf-all.tar.gz" \
            --output /tmp/curlie-rdf-all.tar.gz
      - name: Import curated resources
        run: |
          python scripts/import_curlie.py \
            --dump /tmp/curlie-rdf-all.tar.gz \
            --catalog data/sources.json \
            --limit 12000 \
            --per-topic 250
      - name: Create catalog update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/curlie-catalog-update
          delete-branch: true
          commit-message: "chore: refresh curated Curlie resources"
          title: "chore: refresh Curlie resource catalog"
          body: |
            Automated refresh of curated resources imported from the official Curlie dataset.
            This pull request is created so repository branch protections and required validation checks remain enforced.
          add-paths: data/sources.json
