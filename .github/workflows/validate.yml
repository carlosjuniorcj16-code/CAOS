name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python catalog tools
        run: python -m py_compile scripts/*.py
      - name: Smoke-test DOAJ public journal metadata API
        if: github.event_name == 'pull_request'
        run: python scripts/ingest_doaj_journals.py --limit 5 --page-size 10 --max-pages 1 --dry-run
      - name: Smoke-test OpenAlex institution metadata API
        if: github.event_name == 'pull_request'
        run: python scripts/ingest_openalex_institutions.py --limit 5 --max-pages 1 --dry-run
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Build compact search index
        run: python scripts/build_search_index.py
      - name: Check compact index output
        run: python -c "import json; d=json.load(open('search-index.json', encoding='utf-8')); assert d['total'] > 0 and len(d['resources']) == d['total']"
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          total = 0
          for page in ("index.html", "ai-data.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = [body for attrs, body in re.findall(r"<script\\b([^>]*)>([\\s\\S]*?)</script>", html, re.I) if "application/ld+json" not in attrs.lower()]
              if not scripts:
                  raise SystemExit(f"Nenhum script inline encontrado em {page}.")
              for i, script in enumerate(scripts):
                  Path(f"/tmp/caos-{Path(page).stem}-{i}.js").write_text(script, encoding="utf-8")
              total += len(scripts)
          print(f"{total} bloco(s) de script extraído(s) das duas páginas.")
          PY
          for file in /tmp/caos-*.js; do node --check "$file"; done
