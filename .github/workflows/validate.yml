name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python catalog tools
        run: python -m py_compile scripts/*.py
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("Nenhum script inline encontrado.")
          for i, script in enumerate(scripts):
              Path(f"/tmp/caos-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"{len(scripts)} bloco(s) de script extraído(s).")
          PY
          for file in /tmp/caos-inline-*.js; do node --check "$file"; done
