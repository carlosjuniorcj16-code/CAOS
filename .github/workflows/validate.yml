name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python tools
        run: python -m py_compile scripts/*.py
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Validate open-source software atlas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/open-source-software.json").read_text(encoding="utf-8"))
          assert data.get("schema_version") == 1
          categories = data.get("categories", [])
          assert len(categories) == 8, f"Expected 8 categories, got {len(categories)}"
          names, urls = set(), set()
          total = 0
          for category in categories:
              assert category.get("id") and category.get("title") and category.get("description")
              for item in category.get("resources", []):
                  total += 1
                  assert item.get("name") and item.get("description_pt") and item.get("platform")
                  assert item["name"] not in names, f"Duplicate resource name: {item['name']}"
                  names.add(item["name"])
                  assert item.get("url", "").startswith("https://"), item.get("name")
                  assert item["url"] not in urls, f"Duplicate URL: {item['url']}"
                  urls.add(item["url"])
                  assert item.get("license_note"), f"Missing license note: {item.get('name')}"
                  if item.get("docs"):
                      assert item["docs"].startswith("https://"), item["name"]
          assert total >= 200, f"Expected at least 200 curated resources, got {total}"
          print(f"Open-source atlas valid: {total} resources across {len(categories)} categories.")
          PY
      - name: Validate research feed schemas and source URLs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("research-radar.json", "reading-recommendations.json"):
              path = Path("data") / name
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict) and "schema_version" in data
              if name == "reading-recommendations.json":
                  assert len(data.get("topics", [])) == 8
              for item in data.get("items", []):
                  assert item.get("url", "").startswith("https://")
              for topic in data.get("topics", []):
                  assert len(topic.get("items", [])) <= 5
                  for item in topic.get("items", []):
                      assert item.get("url", "").startswith("https://")
          print("Research feeds structurally valid.")
          PY
      - name: Build compact search index
        run: python scripts/build_search_index.py
      - name: Check compact index output
        run: python -c "import json; d=json.load(open('search-index.json', encoding='utf-8')); assert d['total'] > 0 and len(d['resources']) == d['total']"
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          total = 0
          for page in ("index.html", "ai-data.html", "radar.html", "leituras.html", "software.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = [body for attrs, body in re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, re.I) if "application/ld+json" not in attrs.lower()]
              for i, script in enumerate(scripts):
                  Path(f"/tmp/caos-{Path(page).stem}-{i}.js").write_text(script, encoding="utf-8")
              total += len(scripts)
          for file in Path("/tmp").glob("caos-*.js"):
              import subprocess
              subprocess.run(["node", "--check", str(file)], check=True)
          print(f"{total} JavaScript block(s) syntax-checked.")
          PY
