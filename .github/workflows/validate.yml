name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python tools
        run: python -m py_compile scripts/*.py
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Build exact site-wide URL count
        run: python scripts/build_site_stats.py
      - name: Validate shared CSS and SVG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          css = Path("assets/caos-refresh.css").read_text(encoding="utf-8")
          if r"\n." in css:
              raise SystemExit("Malformed literal backslash-n sequence in shared CSS")
          ET.parse("assets/caos-mark.svg")
          print("Shared CSS and SVG assets valid.")
          PY
      - name: Validate research feed schemas and source URLs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("research-radar.json", "reading-recommendations.json", "open-source-software.json", "freeware.json"):
              path = Path("data") / name
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict) and "schema_version" in data
              if name == "reading-recommendations.json":
                  assert len(data.get("topics", [])) == 8
              if name == "open-source-software.json":
                  assert len(data.get("categories", [])) >= 9
                  assert sum(len(c.get("resources", [])) for c in data["categories"]) >= 170
                  schema = data.get("record_schema", {})
                  required = {"id", "name", "canonical_url", "category_id", "resource_type", "license_status", "maintenance_status", "source_verified_at"}
                  assert required <= set(schema.get("required", []))
                  assert "license_scope" in schema.get("field_rules", {})
                  assert "proprietary_components" in schema.get("optional", [])
              if name == "freeware.json":
                  assert len(data.get("categories", [])) >= 4
                  entries = [item for category in data["categories"] for item in category.get("items", [])]
                  assert len(entries) >= 15
                  for item in entries:
                      assert item.get("url", "").startswith("https://")
                      assert item.get("category") and item.get("platforms")
                      assert item.get("license_status") and item.get("maintenance")
                      assert item.get("evidence") and item.get("risks")
              for item in data.get("items", []):
                  assert item.get("url", "").startswith("https://")
              for topic in data.get("topics", []):
                  assert len(topic.get("items", [])) <= 5
                  for item in topic.get("items", []):
                      assert item.get("url", "").startswith("https://")
          print("Research feeds structurally valid.")
          PY
      - name: Validate global taxonomy and supplemental sources
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path("data/global-sources.json").read_text(encoding="utf-8"))
          items = data.get("resources", [])
          assert data.get("schema_version") == 1
          assert len(items) >= 50, f"Expected at least 50 supplemental sources, found {len(items)}"
          ids = [str(x.get("id", "")) for x in items]
          assert len(ids) == len(set(ids)) and all(ids)
          urls = [x.get("url", "") for x in items]
          assert all(u.startswith("https://") for u in urls)
          assert len(urls) == len(set(u.rstrip("/").lower() for u in urls))
          required = {"title", "topic", "description_pt", "verification_status", "checked_at"}
          assert all(required <= set(x) for x in items)
          assert all(x["verification_status"] == "candidate_unverified" and x["checked_at"] is None for x in items)
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"const TOPICS=(\[.*?\]);", html, re.S)
          assert match, "Topic taxonomy not found"
          topics = json.loads(match.group(1))
          topic_ids = [x["id"] for x in topics]
          assert len(topics) >= 200 and len(topic_ids) == len(set(topic_ids))
          assert all(x["topic"] in set(topic_ids) for x in items)
          assert "categoryResults" in html and "Math.random()" not in html
          assert "id=\"categoryToggle\"" not in html and "id=\"categoryGroups\"" not in html
          main_data = json.loads(Path("data/sources.json").read_text(encoding="utf-8"))
          main_items = main_data if isinstance(main_data, list) else main_data.get("resources", [])
          main_urls = {x.get("url", "").strip().rstrip("/").lower() for x in main_items}
          new_unique = {x["url"].strip().rstrip("/").lower() for x in items} - main_urls
          assert len(new_unique) >= 20, f"Too few distinct new source URLs: {len(new_unique)}"
          assert "freeware-feature" not in html and "quantum-feature" not in html
          assert 'fetch("./data/sources.json")' in html and 'fetch("./data/global-sources.json")' in html
          css = Path("assets/caos-refresh.css").read_text(encoding="utf-8")
          assert ".brandline{margin-top:10px" in css
          print(f"Global catalogue: {len(items)} candidates, {len(new_unique)} distinct additional URLs; taxonomy: {len(topics)} unique categories.")
          PY
      - name: Build compact search index
        run: python scripts/build_search_index.py
      - name: Check compact index output
        run: python -c "import json; d=json.load(open('search-index.json', encoding='utf-8')); assert d['total'] > 0 and len(d['resources']) == d['total']"
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          total = 0
          for page in ("index.html", "ai-data.html", "radar.html", "leituras.html", "software.html", "freeware.html", "quantum.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = [body for attrs, body in re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, re.I) if "application/ld+json" not in attrs.lower()]
              for i, script in enumerate(scripts):
                  Path(f"/tmp/caos-{Path(page).stem}-{i}.js").write_text(script, encoding="utf-8")
              total += len(scripts)
          for file in Path("/tmp").glob("caos-*.js"):
              import subprocess
              subprocess.run(["node", "--check", str(file)], check=True)
          print(f"{total} JavaScript block(s) syntax-checked.")
          PY
