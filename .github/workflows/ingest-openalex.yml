name: Import OpenAlex institution directory

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of new institutions
        required: false
        default: "500"
        type: string
      max_pages:
        description: Maximum API pages (100 records per page)
        required: false
        default: "5"
        type: string
      dry_run:
        description: Preview only; do not modify the catalogue
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile importer
        run: python -m py_compile scripts/ingest_openalex_institutions.py
      - name: Preview import
        if: ${{ inputs.dry_run }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/ingest_openalex_institutions.py --limit "${{ inputs.limit }}" --max-pages "${{ inputs.max_pages }}" --dry-run
      - name: Import approved batch
        if: ${{ !inputs.dry_run }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/ingest_openalex_institutions.py --limit "${{ inputs.limit }}" --max-pages "${{ inputs.max_pages }}"
      - name: Create catalogue update pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: openalex/import-${{ github.run_id }}
          delete-branch: true
          commit-message: "Import OpenAlex institution records"
          title: "Import OpenAlex institution records"
          body: |
            ## OpenAlex institution import

            This pull request contains the institution metadata generated by the
            manual OpenAlex import workflow.

            - Review the added records and provenance fields.
            - Confirm catalog validation and generated-site deployment checks pass.
            - Merge only after review.
          add-paths: |
            data/sources.json
