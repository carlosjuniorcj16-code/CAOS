name: Import OpenAlex institution directory

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of new institutions
        required: false
        default: "500"
        type: string
      max_pages:
        description: Maximum API pages (100 records per page)
        required: false
        default: "5"
        type: string
      dry_run:
        description: Preview only; do not modify the catalogue
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile importer
        run: python -m py_compile scripts/ingest_openalex_institutions.py
      - name: Preview import
        if: ${{ inputs.dry_run }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/ingest_openalex_institutions.py --limit "${{ inputs.limit }}" --max-pages "${{ inputs.max_pages }}" --dry-run
      - name: Import approved batch
        if: ${{ !inputs.dry_run }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/ingest_openalex_institutions.py --limit "${{ inputs.limit }}" --max-pages "${{ inputs.max_pages }}"
      - name: Commit catalogue update
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data/sources.json; then
            echo "No new institution records to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json
          git commit -m "Import OpenAlex institution records"
          git push
