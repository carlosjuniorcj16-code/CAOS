name: CAOS automated catalog triage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caos-catalog-triage
  cancel-in-progress: false

jobs:
  triage:
    name: Classify catalog metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile triage tool
        run: python -m py_compile scripts/outreach_triage.py
      - name: Classify all catalog records
        run: python scripts/outreach_triage.py
      - name: Upload triage report
        uses: actions/upload-artifact@v4
        with:
          name: caos-catalog-triage-${{ github.run_number }}
          path: outreach/triage.csv
          if-no-files-found: error
          retention-days: 14
