name: CAOS live research radar and reading suggestions

on:
  schedule:
    - cron: "20 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: caos-live-research-radar
  cancel-in-progress: false

jobs:
  update-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect research from scholarly APIs
        run: python scripts/update_research_radar.py
      - name: Validate generated feeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          radar = json.loads(Path("data/research-radar.json").read_text(encoding="utf-8"))
          reads = json.loads(Path("data/reading-recommendations.json").read_text(encoding="utf-8"))
          assert radar["schema_version"] == 2 and 1 <= len(radar["items"]) <= 5
          assert reads["schema_version"] == 1 and len(reads["topics"]) == 8
          assert all(len(topic["items"]) <= 5 for topic in reads["topics"])
          for item in radar["items"] + [x for t in reads["topics"] for x in t["items"]]:
              assert item["url"].startswith("https://")
              assert item["title"] and item["published"] and item["area"]
          print("Research feeds valid.")
          PY
      - name: Create or update reviewable research PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh research radar and reading suggestions"
          title: "chore: refresh research radar and reading suggestions"
          body: |
            Automated update of CAOS research discovery feeds.

            Sources: arXiv, Europe PMC, PubMed E-utilities and Crossref public scholarly metadata APIs.
            Includes the compact research radar and up to five recent reading suggestions across eight subject areas.
            Only generated JSON feeds are changed. No full-text articles or PDFs are copied.
            Eligible for automatic squash merge only after catalog validation and the Pages build succeed. Failed checks or additional branch-protection requirements keep the PR open.
          branch: automation/research-radar
          delete-branch: true
          add-paths: |
            data/research-radar.json
            data/reading-recommendations.json

      - name: Dispatch validation and build for the bot PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/research-radar
        run: |
          gh workflow run "Validate project" --ref "$BRANCH"
          gh workflow run "Build and deploy CAOS SEO site" --ref "$BRANCH"
