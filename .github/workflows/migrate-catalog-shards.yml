name: Prepare CAOS catalogue shard migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: caos-catalog-shard-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current catalogue
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated migration branch
        id: branch
        run: |
          BRANCH="migration/catalog-shards-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Compile catalog tools
        run: python -m py_compile scripts/*.py
      - name: Test shard reader and writer
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Split canonical catalogue and verify exact integrity
        run: python scripts/migrate_catalog_shards.py --max-shard-mb 18
      - name: Validate all catalog consumers
        run: |
          python scripts/validate_catalog.py
          python scripts/build_search_index.py
          python scripts/build_site_stats.py
          CAOS_SITE_URL=https://carlosjuniorcj16-code.github.io/CAOS python scripts/build_seo.py
          test -s dist/index.html
          test -s dist/search-index.json
          test -s dist/site-stats.json
          test -s dist/data/sources.json
          test -d dist/data/sources
      - name: Push migration branch and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/sources/
          if git diff --cached --quiet; then
            echo "Catalogue is already sharded; no migration PR is needed."
            exit 0
          fi
          git commit -m "Split canonical catalogue into bounded JSON shards"
          git push origin HEAD:${{ steps.branch.outputs.name }}
          gh pr create --base main --head "${{ steps.branch.outputs.name }}" --title "Split CAOS canonical catalogue into bounded JSON shards" --body "## Summary
          - Replaces the oversized canonical JSON file with a small manifest and bounded JSON shards.
          - Preserves the exact catalogue content; the migration verifies record count and SHA-256 before and after.
          - Runs catalog validation, search-index generation, site statistics, and the SEO build before opening this PR.
          
          This PR is generated by the CAOS migration workflow. No production deployment occurs until it is reviewed and merged."
